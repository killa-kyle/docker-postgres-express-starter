version: '3'
services:
  database-starter-frontend:
    image: database-starter-frontend:latest
    environment:
      PORT: 3000
      PROXY_API: http://database-starter-backend:4000/
    ports:
      - 3000:3000
      - 8080:80
  database-starter-backend:
    image: database-starter-backend:latest
    environment:
      PORT: 4000
    ports:
      - 4000:4000
